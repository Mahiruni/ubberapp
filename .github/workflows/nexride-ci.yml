name: Biloo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biloo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_NAME: Biloo
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://eyyvvwecpyctttiueban.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kXFOrtwKkKmrqCtYTTuzdg__CjjABBf
  # The integration suite exercises the deterministic provider-unavailable fallback.
  NEXT_PUBLIC_MAPBOX_TOKEN: replace_me
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qa:
    name: Unit tests, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build

  end-to-end:
    name: Full E2E · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run full E2E suite shard
        run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=2 --timeout=45000
      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biloo-e2e-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
