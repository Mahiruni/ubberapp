name: NexRide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: nexride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_NAME: NexRide
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://eyyvvwecpyctttiueban.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kXFOrtwKkKmrqCtYTTuzdg__CjjABBf
      # Keep routing in its explicit provider-unavailable fallback during deterministic CI.
      NEXT_PUBLIC_MAPBOX_TOKEN: replace_me
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexride-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
