name: NexRide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: nexride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_NAME: NexRide
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://eyyvvwecpyctttiueban.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kXFOrtwKkKmrqCtYTTuzdg__CjjABBf
  # Force the explicit provider-unavailable fallback in deterministic browser CI.
  NEXT_PUBLIC_MAPBOX_TOKEN: replace_me

jobs:
  quality:
    name: Unit tests, TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build

  browser:
    name: Browser E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile, webkit, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: E2E tests
        run: npx playwright test --project=${{ matrix.project }} --max-failures=5
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexride-playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
