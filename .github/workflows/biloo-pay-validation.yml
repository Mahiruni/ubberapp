name: Biloo Pay validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/biloo-pay-secure-ledger]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biloo-pay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payment-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BILOO_PAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:payments
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:payments:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: biloo-pay-local-fixture-report
          path: playwright-report/biloo-pay/
          retention-days: 7
