name: Biloo Android release pipeline

'on':
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build signed release APKs using the existing Rider/Driver signing keys
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths: &android_paths
      - '.github/workflows/android-apks.yml'
      - 'native/android/**'
      - 'scripts/*android*'
      - 'scripts/generate-brand-assets.mjs'
      - 'scripts/generate-nexride-alert-sound.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/unit/biloo-android-release.test.ts'
      - 'tests/unit/biloo-native-auth-storage.test.ts'
      - 'tests/unit/biloo-native-trip-location.test.ts'
      - 'tests/unit/biloo-native-gps-route.test.ts'
      - 'tests/unit/nexride-driver-gps.test.ts'
      - 'lib/biloo-native-auth-storage.ts'
      - 'lib/nexride-native-reliability.ts'
      - 'lib/supabase.ts'
      - 'lib/biloo-native-trip-location.ts'
      - 'app/api/driver/availability/route.ts'
      - 'components/nexride/driver-session-bridge.tsx'
      - 'components/nexride/native-reliability-settings.tsx'
      - 'components/nexride/driver.tsx'
      - 'components/nexride/permission-settings.tsx'
      - 'app/driver/navigation/page.tsx'
      - 'tests/native/**'
  push:
    branches: [main]
    paths: *android_paths

permissions:
  contents: read

concurrency:
  group: biloo-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Verify ${{ matrix.role }} release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [rider, driver]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Check Android generation and release rules
        run: npm run test:android
      - name: Prepare the isolated role and increasing build number
        run: node scripts/prepare-android.mjs '${{ matrix.role }}' "$GITHUB_RUN_NUMBER"
      - name: Verify SDK tools
        run: |
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Compile, test and lint the real release variant
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 testReleaseUnitTest lintRelease assembleRelease
      - name: Verify unsigned build identity, version and release flags
        run: python3 scripts/verify-android-release.py --apk android/app/build/outputs/apk/release/app-release-unsigned.apk --out dist/android/verification
      - name: Upload build verification only (not an installable release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Biloo-${{ matrix.role }}-unsigned-verification-${{ github.run_number }}
          path: dist/android/verification/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android test/lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Biloo-${{ matrix.role }}-checks-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7

  signed_release:
    name: Sign and verify ${{ matrix.role }} APK
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: rider
            prefix: RIDER
          - role: driver
            prefix: DRIVER
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Prepare release package
        run: node scripts/prepare-android.mjs '${{ matrix.role }}' "$GITHUB_RUN_NUMBER"
      - name: Validate the production Firebase app
        env:
          FIREBASE_CONFIG_B64: ${{ secrets[format('NEXRIDE_{0}_GOOGLE_SERVICES_BASE64', matrix.prefix)] }}
        run: python3 scripts/validate-android-firebase-config.py '${{ matrix.role }}'
      - name: Verify the existing release signing identity
        env:
          BILOO_KEYSTORE_BASE64: ${{ secrets[format('BILOO_{0}_KEYSTORE_BASE64', matrix.prefix)] }}
          BILOO_ANDROID_STORE_PASSWORD: ${{ secrets[format('BILOO_{0}_STORE_PASSWORD', matrix.prefix)] }}
          BILOO_ANDROID_KEY_ALIAS: ${{ secrets[format('BILOO_{0}_KEY_ALIAS', matrix.prefix)] }}
          BILOO_ANDROID_KEY_PASSWORD: ${{ secrets[format('BILOO_{0}_KEY_PASSWORD', matrix.prefix)] }}
          BILOO_ANDROID_CERT_SHA256: ${{ vars[format('BILOO_{0}_CERT_SHA256', matrix.prefix)] }}
        run: python3 scripts/prepare-android-signing.py
      - name: Build the signed release
        working-directory: android
        env:
          BILOO_ANDROID_STORE_PASSWORD: ${{ secrets[format('BILOO_{0}_STORE_PASSWORD', matrix.prefix)] }}
          BILOO_ANDROID_KEY_ALIAS: ${{ secrets[format('BILOO_{0}_KEY_ALIAS', matrix.prefix)] }}
          BILOO_ANDROID_KEY_PASSWORD: ${{ secrets[format('BILOO_{0}_KEY_PASSWORD', matrix.prefix)] }}
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease
      - name: Verify signature, Firebase resources and APK metadata
        env:
          BILOO_ANDROID_CERT_SHA256: ${{ vars[format('BILOO_{0}_CERT_SHA256', matrix.prefix)] }}
        run: python3 scripts/verify-android-release.py --apk android/app/build/outputs/apk/release/app-release.apk --signed --firebase --out dist/android/release
      - name: Upload verified signed APK and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Biloo-${{ matrix.role }}-signed-release-${{ github.run_number }}
          path: dist/android/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('BILOO_ANDROID_KEYSTORE_FILE')
          if value:
              key = Path(value)
              if key.parent.parent == Path(os.environ['RUNNER_TEMP']) and key.parent.name.startswith('biloo-signing-'):
                  key.unlink(missing_ok=True)
                  key.parent.rmdir()
          PY
