name: Build NexRide Rider and Driver APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/rider-human-avatar-tracking
    paths:
      - .github/workflows/android-apks.yml

permissions:
  contents: read

concurrency:
  group: nexride-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role:
          - rider
          - driver

    steps:
      - name: Checkout NexRide
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify hosted Android SDK
        run: |
          test -d "${ANDROID_HOME:?ANDROID_HOME is required}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || test -d "${ANDROID_HOME}/platforms"
          echo "Android SDK is available"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Configure separate Android application
        env:
          NEXRIDE_ROLE: ${{ matrix.role }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const role = process.env.NEXRIDE_ROLE;
          if (!['rider', 'driver'].includes(role)) throw new Error('Invalid role');
          const appId = `com.nexride.${role}`;
          const appName = role === 'rider' ? 'NexRide Rider' : 'NexRide Driver';
          const startPath = `/${role}`;
          const webDir = '.capacitor-shell';
          fs.mkdirSync(webDir, { recursive: true });
          fs.writeFileSync(`${webDir}/index.html`, '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><p>NexRide needs an internet connection to load.</p></body></html>');
          fs.writeFileSync('capacitor.config.json', JSON.stringify({
            appId, appName, webDir,
            server: {
              url: `https://ubberapp.vercel.app${startPath}`,
              cleartext: false,
              androidScheme: 'https'
            },
            android: { allowMixedContent: false }
          }, null, 2));
          NODE

      - name: Generate native Android shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply minimum Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path('android/app/src/main/AndroidManifest.xml')
          s = f.read_text()
          permissions = [
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.CAMERA'
          ]
          tags = ''.join(f'    <uses-permission android:name="{permission}" />\n' for permission in permissions if permission not in s)
          if '<application' not in s:
              raise SystemExit('Android manifest lacks application element')
          s = s.replace('<application', tags + '    <application', 1)
          s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          f.write_text(s)
          PY

      - name: Verify Android role, URL and permissions
        env:
          NEXRIDE_ROLE: ${{ matrix.role }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const role = process.env.NEXRIDE_ROLE;
          if (config.appId !== `com.nexride.${role}`) throw new Error('Incorrect package id');
          if (config.server.url !== `https://ubberapp.vercel.app/${role}`) throw new Error('Incorrect app target');
          if (config.server.cleartext !== false || config.android.allowMixedContent !== false) throw new Error('Insecure shell');
          NODE
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage role-specific APK
        env:
          NEXRIDE_ROLE: ${{ matrix.role }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NexRide-${NEXRIDE_ROLE}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NexRide-${{ matrix.role }}-debug-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
