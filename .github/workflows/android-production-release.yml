name: NexRide — Production Signed Android APKs

'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexride-production-signed-android
  cancel-in-progress: false

jobs:
  signed-android:
    name: Release-sign ${{ matrix.role }} APK
    # Only protected main commits can access the Android release keystore.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-production
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [rider, driver]
    steps:
      - name: Checkout vetted source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release compatibility logic
        run: npx vitest run lib/nexride-release-policy.test.ts

      - name: Install pinned Capacitor Android tooling
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8 @capacitor/push-notifications@8 @capacitor/share@8 @capacitor/splash-screen@8.0.2

      - name: Harden native push permission handling
        run: |
          node scripts/harden-android-push-notifications.mjs
          grep -q 'nexRideAlertsEnabled' node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java

      - name: Configure role-isolated Capacitor shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.role }}" = "rider" ]; then
            APP_ID="com.nexride.rider"
            APP_NAME="NexRide Rider"
            START_PATH="/rider"
          else
            APP_ID="com.nexride.driver"
            APP_NAME="NexRide Driver"
            START_PATH="/driver"
          fi
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "public",
            "server": {
              "url": "https://ubberapp.vercel.app$START_PATH",
              "cleartext": false,
              "androidScheme": "https"
            },
            "android": { "allowMixedContent": false },
            "plugins": {
              "SplashScreen": {
                "launchAutoHide": true,
                "launchShowDuration": 0,
                "launchFadeOutDuration": 160,
                "backgroundColor": "#041C30",
                "showSpinner": false
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Install official Android splash
        run: node scripts/setup-android-splash.mjs "${{ matrix.role }}"

      - name: Inject role-specific Firebase and native reliability
        env:
          FIREBASE_CONFIG_B64: ${{ matrix.role == 'driver' && secrets.NEXRIDE_DRIVER_GOOGLE_SERVICES_BASE64 || secrets.NEXRIDE_RIDER_GOOGLE_SERVICES_BASE64 }}
        run: |
          node scripts/setup-android-reliability.mjs "${{ matrix.role }}"
          python3 scripts/validate-android-firebase-config.py "${{ matrix.role }}"
          grep -q 'registerPlugin(NexRideReleaseIdentityPlugin.class)' android/app/src/main/java/com/nexride/${{ matrix.role }}/MainActivity.java
          grep -q 'nexride-2026-10-14-02' android/app/src/main/java/com/nexride/${{ matrix.role }}/NexRideReleaseIdentityPlugin.java
          if [ "${{ matrix.role }}" = "driver" ]; then
            python3 scripts/generate-nexride-alert-sound.py
          fi

      - name: Install native App Lock, controls and unit tests
        run: node scripts/setup-android-app-lock.mjs "${{ matrix.role }}"

      - name: Harden Android application manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = (
            '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
            '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
            '    <uses-permission android:name="android.permission.CAMERA" />\n'
            '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)
          s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          if 'android:enableOnBackInvokedCallback=' not in s:
              s = s.replace('<application', '<application android:enableOnBackInvokedCallback="true"', 1)
          p.write_text(s)
          PY

      - name: Create role-specific launcher icons
        run: |
          node scripts/sync-android-icons.mjs "${{ matrix.role }}"
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Stamp immutable Android release version
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n = re.subn(r"\bversionCode\s+\d+\b", "versionCode 20261014", s, count=1)
          if n != 1: raise SystemExit("Android versionCode was not found")
          s, n = re.subn(r'\bversionName\s+["\'][^"\']+["\']', 'versionName "2.0.0"', s, count=1)
          if n != 1: raise SystemExit("Android versionName was not found")
          p.write_text(s)
          PY
          grep -q 'versionCode 20261014' android/app/build.gradle
          grep -q 'versionName "2.0.0"' android/app/build.gradle

      - name: Sign release APK using stored production keystore
        shell: bash
        env:
          NEXRIDE_KEYSTORE_B64: ${{ secrets.NEXRIDE_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          NEXRIDE_RELEASE_STORE_PASSWORD: ${{ secrets.NEXRIDE_ANDROID_RELEASE_STORE_PASSWORD }}
          NEXRIDE_RELEASE_KEY_ALIAS: ${{ secrets.NEXRIDE_ANDROID_RELEASE_KEY_ALIAS }}
          NEXRIDE_RELEASE_KEY_PASSWORD: ${{ secrets.NEXRIDE_ANDROID_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.NEXRIDE_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in NEXRIDE_KEYSTORE_B64 NEXRIDE_RELEASE_STORE_PASSWORD NEXRIDE_RELEASE_KEY_ALIAS NEXRIDE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android production signing setting: $name. Configure repository environment android-production."
              exit 1
            fi
          done
          export NEXRIDE_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/nexride-release.jks"
          trap 'rm -f "$NEXRIDE_RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$NEXRIDE_KEYSTORE_B64" | base64 --decode > "$NEXRIDE_RELEASE_KEYSTORE_PATH"
          chmod 600 "$NEXRIDE_RELEASE_KEYSTORE_PATH"
          unset NEXRIDE_KEYSTORE_B64
          node scripts/configure-android-release-signing.mjs "${{ matrix.role }}"
          (
            cd android
            ./gradlew --no-daemon testDebugUnitTest assembleRelease
          )
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature-verification.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signature-verification.txt"
          APP_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          case "$APP_BADGING" in
            *"name='com.nexride.${{ matrix.role }}' versionCode='20261014' versionName='2.0.0'"*) ;;
            *) echo "::error::Android package ID or release version does not match expected role"; exit 1 ;;
          esac
          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature-verification.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [ "$ACTUAL_CERT" != "$EXPECTED" ]; then
              echo "::error::Release signing certificate does not match pinned signing identity"
              exit 1
            fi
          fi
          echo "Signer certificate SHA-256: $ACTUAL_CERT"
          mkdir -p dist
          cp "$APK" "dist/NexRide-${{ matrix.role }}-v2.0.0-release.apk"
          (cd dist && sha256sum *.apk > "SHA256SUMS-${{ matrix.role }}.txt")

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexRide-${{ matrix.role }}-v2.0.0-signed
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified APKs to GitHub Releases
    needs: signed-android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-production
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Collect both verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NexRide-*-v2.0.0-signed
          path: dist
          merge-multiple: true
      - name: Confirm both roles and compute checksums
        run: |
          set -euo pipefail
          test -s dist/NexRide-rider-v2.0.0-release.apk
          test -s dist/NexRide-driver-v2.0.0-release.apk
          (cd dist && sha256sum NexRide-*-v2.0.0-release.apk > SHA256SUMS.txt)
      - name: Create immutable official signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="android-v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Never overwrite signed production APKs."
            exit 1
          fi
          gh release create "$TAG" \
            dist/NexRide-rider-v2.0.0-release.apk \
            dist/NexRide-driver-v2.0.0-release.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "NexRide Rider & Driver v2.0.0 — Signed Android" \
            --notes "Production-signed Rider and Driver APKs. Release ID nexride-2026-10-14-02, Android versionCode 20261014. Verify installation and protected API behavior before enabling legacy APK retirement. Earlier debug-signed installations may require uninstall/reinstall, which can erase local unsynced data."
