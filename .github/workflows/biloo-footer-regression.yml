name: Biloo Footer Navigation Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "components/nexride/biloo-footer-nav.tsx"
      - "components/nexride/ui.tsx"
      - "components/nexride/driver-app-shell.tsx"
      - "app/page.tsx"
      - "app/layout.tsx"
      - "app/rider/trips/page.tsx"
      - "app/rider/wallet/page.tsx"
      - "app/support/page.tsx"
      - "app/biloo-footer-navigation.css"
      - "tests/**/biloo-footer-navigation.*"
      - ".github/workflows/biloo-footer-regression.yml"
  push:
    branches: [main]
    paths:
      - "components/nexride/biloo-footer-nav.tsx"
      - "app/biloo-footer-navigation.css"
      - "tests/**/biloo-footer-navigation.*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footer:
    name: Rider + Driver footer routes, gestures and responsive layout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_MAPBOX_TOKEN: replace_me
      NEXT_PUBLIC_SUPABASE_URL: https://eyyvvwecpyctttiueban.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kXFOrtwKkKmrqCtYTTuzdg__CjjABBf
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/unit/biloo-footer-navigation.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/biloo-footer-navigation.spec.ts --project=chromium --project=mobile --workers=2 --timeout=45000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biloo-footer-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
