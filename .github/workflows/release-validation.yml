name: NexRide Release Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexride-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Record release validation
        if: always()
        run: |
          echo "Validated commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit tests, TypeScript and Next.js production build are required to pass before this job is successful." >> "$GITHUB_STEP_SUMMARY"
